name: Stock

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Seed state from stock-state branch
        run: |
          # State lives on stock-state, not main (main is a protected branch and
          # rejects direct pushes - see the push step below). Read the file
          # straight out of that branch without checking it out; fall back to an
          # empty object on the very first run, before stock-state exists.
          git fetch origin stock-state 2>/dev/null || true
          mkdir -p .github/states
          git show origin/stock-state:.github/states/stock.json > .github/states/stock.json 2>/dev/null \
            || echo '{}' > .github/states/stock.json

      - name: Check stock with Claude
        id: check
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # show_full_output: true  # uncomment to see the full transcript for debugging
          prompt: |
            Products to check, as a JSON object mapping key to URL:
            ${{ toJSON(fromJSON(vars.STOCK_PRODUCTS)) }}

            For each product in that object, use WebFetch to load its URL and
            determine whether it is currently in stock and purchasable (look
            for an "add to cart" call to action versus out-of-stock /
            unavailable messaging). Return one entry per product key in the
            `results` array, with status one of "in_stock", "out_of_stock",
            or "unknown" if you can't tell.

            Also report a reliability number from 0 to 1 for each
            determination: your confidence that the status you reported is
            correct, not how much content you managed to fetch. 1 means
            absolutely reliable - you found explicit, unambiguous stock
            information. Lower values mean you only had indirect evidence,
            such as an add-to-cart button with no explicit stock statement.
            0 means you have no reliable basis at all for the status you're
            reporting.

            Note: if the fetch failed, was blocked, or the page had no real
            product content (e.g. a js-rendered page / SPA whose product data
            never appears in the fetched content), reporting "unknown" is
            itself the correct and reliable conclusion - give that a high
            reliability score, not a low one, since correctly recognizing you
            can't tell is the reliable answer.
          claude_args: |
            --allowedTools "WebFetch"
            --json-schema '{"type":"object","properties":{"results":{"type":"array","items":{"type":"object","properties":{"key":{"type":"string"},"status":{"type":"string","enum":["in_stock","out_of_stock","unknown"]},"reliability":{"type":"number","minimum":0,"maximum":1}},"required":["key","status","reliability"]}}},"required":["results"]}'

      - name: Notify on stock change
        env:
          STOCK_WEBHOOK_URL: ${{ secrets.STOCK_WEBHOOK_URL }}
          CLAUDE_RESULT: ${{ steps.check.outputs.structured_output }}
        run: node .github/scripts/stock.mjs

      - name: Push updated state to stock-state branch
        run: |
          # 1. stock.mjs already wrote the new state into the working tree - save it
          #    off before we switch branches out from under it.
          cp .github/states/stock.json /tmp/new-stock-state.json

          # 2. Even though this path isn't tracked on the current branch, `git
          #    checkout` still refuses to switch if an untracked file would be
          #    overwritten by a tracked file of the same path on the target
          #    branch. Delete it first to avoid that collision.
          rm -f .github/states/stock.json

          git fetch origin stock-state 2>/dev/null || true

          # 3. Does stock-state exist yet? git rev-parse resolves a ref to a SHA
          #    and fails if the ref doesn't exist.
          if git rev-parse --verify origin/stock-state >/dev/null 2>&1; then
            # 5. Subsequent runs: reset a local stock-state branch to match the
            #    latest fetched remote copy.
            git checkout -B stock-state origin/stock-state
          else
            # 4. First run ever: create a branch with no parent commit at all,
            #    fully disconnected from main. Its working tree still has all of
            #    main's files though, so wipe them for a clean slate.
            git checkout --orphan stock-state
            git rm -rf . -q >/dev/null 2>&1 || true
          fi

          mkdir -p .github/states
          cp /tmp/new-stock-state.json .github/states/stock.json

          # 7. Skip committing when nothing actually changed, so we don't spam
          #    the branch with empty/no-op commits.
          if [ -n "$(git status --porcelain .github/states/stock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/states/stock.json
            git commit -m "chore: update stock watch state"
            # 6. Push to stock-state specifically, regardless of the local
            #    branch's name - main is protected and rejects direct pushes,
            #    stock-state is not.
            git push origin HEAD:stock-state
          else
            echo "No state change, skipping commit."
          fi
