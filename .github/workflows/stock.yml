name: Stock

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Seed state from stock-state branch
        run: |
          git fetch origin stock-state 2>/dev/null || true
          mkdir -p .github/states
          git show origin/stock-state:.github/states/stock.json > .github/states/stock.json 2>/dev/null \
            || echo '{}' > .github/states/stock.json

      - name: Check stock with Claude
        id: check
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Products to check, as a JSON object mapping key to URL:
            ${{ toJSON(fromJSON(vars.STOCK_PRODUCTS)) }}

            For each product in that object, use WebFetch to load its URL and
            determine whether it is currently in stock and purchasable (look
            for an "add to cart" call to action versus out-of-stock /
            unavailable messaging). Return one entry per product key in the
            `results` array, with status one of "in_stock", "out_of_stock",
            or "unknown" if you can't tell.
          claude_args: |
            --allowedTools "WebFetch"
            --json-schema '{"type":"object","properties":{"results":{"type":"array","items":{"type":"object","properties":{"key":{"type":"string"},"status":{"type":"string","enum":["in_stock","out_of_stock","unknown"]}},"required":["key","status"]}}},"required":["results"]}'

      - name: Notify on stock change
        env:
          STOCK_WEBHOOK_URL: ${{ secrets.STOCK_WEBHOOK_URL }}
          CLAUDE_RESULT: ${{ steps.check.outputs.structured_output }}
        run: node .github/scripts/stock.mjs

      - name: Push updated state to stock-state branch
        run: |
          cp .github/states/stock.json /tmp/new-stock-state.json
          rm -f .github/states/stock.json
          git fetch origin stock-state 2>/dev/null || true
          if git rev-parse --verify origin/stock-state >/dev/null 2>&1; then
            git checkout -B stock-state origin/stock-state
          else
            git checkout --orphan stock-state
            git rm -rf . -q >/dev/null 2>&1 || true
          fi
          mkdir -p .github/states
          cp /tmp/new-stock-state.json .github/states/stock.json
          if [ -n "$(git status --porcelain .github/states/stock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/states/stock.json
            git commit -m "chore: update stock watch state"
            git push origin HEAD:stock-state
          else
            echo "No state change, skipping commit."
          fi
